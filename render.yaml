services:
  - type: web
    name: missao-aprovacao-tjsp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USER
        value: estudos
      - key: APP_PASSWORD
        sync: false
